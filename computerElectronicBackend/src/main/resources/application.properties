spring.application.name=computerElectronicBackend

# Overrides locales opcionales (gitignored). No versionar secretos reales.
spring.config.import=optional:file:./application-local.properties
 
#  Database configuration (default profile = desarrollo local).
# Producción: usar perfil "prod" (application-prod.properties) — DB_* obligatorios, sin defaults.
# Override local: DB_URL / DB_USERNAME / DB_PASSWORD o application-local.properties
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/solarfishdb}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:admin}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# Storage
app.storage.account.photos-dir=uploads/avatares
app.storage.products.images-dir=uploads/productos
app.storage.services.signatures-dir=uploads/servicios/firmas
app.storage.services.documents-dir=uploads/servicios/documentos

# Frontend (sin slash final). El QR de los PDFs apunta aquí.
app.frontend.base-url=https://test.computerelectroniccentersas.com

# Seguridad — acciones públicas sensibles (consulta OT)
app.security.rate-limit.max-attempts=8
app.security.rate-limit.window-seconds=300
# false: no confiar en X-Forwarded-For del cliente. true solo detrás de proxy que lo controle.
app.security.rate-limit.trust-forwarded-headers=false
# Auth: límites por operación (no reutilizan 8/300 de cotización).
# Login: margen para typos; frena fuerza bruta por IP (15 min).
app.security.rate-limit.auth.login.max-attempts=10
app.security.rate-limit.auth.login.window-seconds=900
# Registro: crea usuario + correo; pocos por hora por IP bastan.
app.security.rate-limit.auth.registro.max-attempts=5
app.security.rate-limit.auth.registro.window-seconds=3600
# Reenvío: envío SMTP costoso; más estricto que login/registro.
app.security.rate-limit.auth.reenviar-verificacion.max-attempts=3
app.security.rate-limit.auth.reenviar-verificacion.window-seconds=3600
# JWT (perfil default = desarrollo). Producción: perfil "prod" exige JWT_SECRET sin fallback.
app.security.jwt.secret=${JWT_SECRET:claveSecretaSuperLargaParaJwt123456789012345678901234567890}
app.security.jwt.expiration-ms=86400000

# CORS (coma-separados): frontend alojado + desarrollo local.
app.cors.allowed-origin-patterns=https://test.computerelectroniccentersas.com,http://localhost:4200

