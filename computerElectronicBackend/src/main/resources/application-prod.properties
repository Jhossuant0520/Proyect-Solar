# Perfil de producción — activar con: --spring.profiles.active=prod
# o SPRING_PROFILES_ACTIVE=prod
#
# Obligatorio en el entorno (sin defaults):
#   JWT_SECRET, DB_URL, DB_USERNAME, DB_PASSWORD
# Opcional: MAIL_USERNAME, MAIL_PASSWORD, MAIL_HOST, MAIL_PORT

# JWT — sin fallback. Si JWT_SECRET falta, el arranque falla.
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-ms=86400000

# Base de datos — sin defaults root/admin. Nombre de DB lo define DB_URL.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate — esquema gestionado fuera de la app (scripts manuales en db/migration).
# none: no altera ni valida contra metadatos (evita fallos por drift histórico de ddl-auto=update).
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never
