# Perfil de pruebas: sin MySQL externo (MTP R6)
spring.application.name=computerElectronicBackend-test

spring.datasource.url=jdbc:h2:mem:solvix_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

app.storage.account.photos-dir=${java.io.tmpdir}/app-test-avatares
app.storage.products.images-dir=${java.io.tmpdir}/app-test-productos
app.storage.services.signatures-dir=${java.io.tmpdir}/app-test-firmas
app.storage.services.documents-dir=${java.io.tmpdir}/app-test-documentos
app.frontend.base-url=http://localhost:4200
app.security.rate-limit.max-attempts=5
app.security.rate-limit.window-seconds=60
app.security.rate-limit.trust-forwarded-headers=false
app.security.rate-limit.auth.login.max-attempts=5
app.security.rate-limit.auth.login.window-seconds=900
app.security.rate-limit.auth.registro.max-attempts=3
app.security.rate-limit.auth.registro.window-seconds=3600
app.security.rate-limit.auth.reenviar-verificacion.max-attempts=2
app.security.rate-limit.auth.reenviar-verificacion.window-seconds=3600
app.cors.allowed-origin-patterns=http://localhost:4200
