<div class="confirm-dialog">
  <h2>Confirmación</h2>
  <p>{{ data.mensaje }}</p>
  <div class="confirm-dialog__actions">
    <solvix-button family="tech" rank="tertiary" type="button" (click)="cerrar(false)">
      Cancelar
    </solvix-button>
    <solvix-button family="tech" rank="danger" type="button" (click)="cerrar(true)">
      Confirmar
    </solvix-button>
  </div>
</div>
