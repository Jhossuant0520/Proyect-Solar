<div class="dashboard-container">
  <div class="animated-bg"></div>

  <div class="dashboard-content">
    <div class="welcome-section">
      <h2>¡Bienvenido, {{ nombreUsuario }}!</h2>
      <p>Administra el catálogo de productos desde aquí.</p>
    </div>

    <div class="dashboard-wrapper">
      <mat-card class="dashboard-card" routerLink="/producto">
        <mat-icon>add_box</mat-icon>
        <p>Registrar producto</p>
      </mat-card>

      <mat-card class="dashboard-card" routerLink="/listaproductos">
        <mat-icon>inventory_2</mat-icon>
        <p>Gestión de productos</p>
      </mat-card>

      <mat-card class="dashboard-card logout-card" (click)="logout()">
        <mat-icon>logout</mat-icon>
        <p>Cerrar sesión</p>
      </mat-card>
    </div>
  </div>
</div>
