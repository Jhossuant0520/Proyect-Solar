<section class="dashboard-page">
  <solvix-dashboard-header
    [periodo]="periodo()"
    [refreshing]="refreshing()"
    (periodoChange)="onPeriodo($event)"
    (refresh)="onRefresh()"
  />

  <solvix-dashboard-kpis
    [metrics]="kpis()"
    [state]="kpiState()"
    (retry)="loadResumen()"
  />

  <div class="dashboard-primary">
    <solvix-sales-evolution
      [points]="serie()"
      [metrica]="metrica()"
      [agrupacion]="agrupacion()"
      [state]="serieState()"
      (metricaChange)="metrica.set($event)"
      (agrupacionChange)="onAgrupacion($event)"
      (retry)="loadVentas()"
    />
  </div>

  <p class="dashboard-more">
    <a [routerLink]="['/dashboard/analisis']" [queryParams]="periodQuery">Ver análisis detallado</a>
  </p>
</section>
