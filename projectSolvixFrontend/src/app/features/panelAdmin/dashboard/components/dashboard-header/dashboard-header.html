<solvix-page-header icon="monitoring"
  kicker="Panel administrativo"
  title="Resumen del negocio"
  subtitle="Esto está pasando en tu negocio"
>
  <div class="header-controls">
    <div class="dash-chips dash-chips--period" role="group" aria-label="Período">
      @for (preset of presets; track preset.id) {
        <button
          type="button"
          class="dash-chip"
          [class.is-active]="periodo.preset === preset.id"
          [attr.aria-pressed]="periodo.preset === preset.id"
          (click)="selectPreset(preset.id)"
        >
          {{ preset.label }}
        </button>
      }
    </div>

    @if (periodo.preset === 'personalizado') {
      <div class="header-dates">
        <label>
          Desde
          <solvix-dashboard-date-field
            [value]="periodo.desde"
            ariaLabel="Fecha desde"
            (valueChange)="onDesdeChange($event)"
          />
        </label>
        <label>
          Hasta
          <solvix-dashboard-date-field
            [value]="periodo.hasta"
            ariaLabel="Fecha hasta"
            (valueChange)="onHastaChange($event)"
          />
        </label>
      </div>
    }

    <div class="header-refresh">
      <solvix-button
        family="tech"
        rank="secondary"
        icon="refresh"
        [disabled]="refreshing"
        [loading]="refreshing"
        ariaLabel="Actualizar"
        (click)="refresh.emit()"
      >
        Actualizar
      </solvix-button>
    </div>
  </div>
</solvix-page-header>
