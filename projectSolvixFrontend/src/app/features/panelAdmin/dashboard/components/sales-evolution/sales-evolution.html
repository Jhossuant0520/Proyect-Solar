<section class="dash-panel" aria-labelledby="evolucion-title">
  <solvix-section-header
    kicker="Serie comercial"
    title="Evolución comercial"
    subtitle="Ventas, devoluciones, ventas netas y ganancia del período."
  >
    <div class="dash-chips" role="group" aria-label="Métrica">
      @for (item of metricas; track item.id) {
        <button
          type="button"
          class="dash-chip"
          [class.is-active]="metrica === item.id"
          [attr.aria-pressed]="metrica === item.id"
          (click)="metricaChange.emit(item.id)"
        >
          {{ item.label }}
        </button>
      }
    </div>
    <div class="dash-chips" role="group" aria-label="Agrupación">
      @for (item of agrupaciones; track item.id) {
        <button
          type="button"
          class="dash-chip"
          [class.is-active]="agrupacion === item.id"
          [attr.aria-pressed]="agrupacion === item.id"
          (click)="agrupacionChange.emit(item.id)"
        >
          {{ item.label }}
        </button>
      }
    </div>
  </solvix-section-header>

  <solvix-section-state [state]="state" loadingLabel="Cargando evolución comercial." (retry)="retry.emit()">
    <div class="chart-wrap">
      <canvas #canvas aria-label="Gráfica de evolución comercial"></canvas>
    </div>
  </solvix-section-state>
</section>
