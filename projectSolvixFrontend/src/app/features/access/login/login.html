<div class="login-page">
  <div class="login-grid" aria-hidden="true"></div>
  <div class="login-glow" aria-hidden="true"></div>

  <a class="back-home" routerLink="/" aria-label="Volver al inicio">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
    </svg>
    <span>Volver al inicio</span>
  </a>

  <main class="login-main fade-up">
    <div class="login-brand">
      <div class="brand-row">
        <img src="logo-empresa.png" alt="" class="brand-logo">
        <h1>COMPUTER & ELECTRONIC </h1>
      </div>
      <p>Plataforma de gestión de ventas y clientes</p>
    </div>

    <div class="login-card">
      <div class="scan-line scan-line--top" aria-hidden="true"></div>

      <header class="login-header">
        <h2>Inicia sesión</h2>
        <div class="status-chip">
          <span class="status-dot" aria-hidden="true"></span>
          Listo para ingresar
        </div>
      </header>

      <form class="login-form" (ngSubmit)="login()" #formRef="ngForm">
        <label class="field" for="username">
          <span class="field-label">
            Usuario
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
          </span>
          <input
            name="username"
            id="username"
            [(ngModel)]="usuarioLogin"
            type="text"
            autocomplete="username"
            placeholder="Tu nombre de usuario"
            required
          />
        </label>

        <label class="field" for="password">
          <span class="field-label">
            Contraseña
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
          </span>
          <div class="field-password">
            <input
              name="password"
              id="password"
              [(ngModel)]="passwordLogin"
              [type]="showPassword ? 'text' : 'password'"
              autocomplete="current-password"
              placeholder="••••••••••••"
              required
            />
            <button
              type="button"
              class="toggle-password"
              (click)="togglePassword()"
              [attr.aria-pressed]="showPassword"
              [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                @if (showPassword) {
                  <path fill="currentColor" d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>
                } @else {
                  <path fill="currentColor" d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                }
              </svg>
            </button>
          </div>
        </label>

        @if (error) {
          <div class="alert alert-error" role="alert">{{ error }}</div>
        }

        <button
          type="submit"
          class="btn-login"
          [disabled]="loading || !formRef.form.valid"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M11 7L9.6 8.4l2.6 2.6H2v2h10.2l-2.6 2.6L11 17l5-5-5-5zm9 12h-8v2h8c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-8v2h8v14z"/></svg>
          {{ loading ? 'Ingresando...' : 'Ingresar' }}
        </button>
      </form>

      <div class="login-links">
        <a routerLink="/register" class="link-register">
          Crear cuenta
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
        </a>
      </div>

      <div class="scan-line scan-line--bottom" aria-hidden="true"></div>
    </div>

    <div class="login-foot">
      <span>Acceso seguro</span>
      <span>Datos cifrados</span>
    </div>
  </main>
</div>
