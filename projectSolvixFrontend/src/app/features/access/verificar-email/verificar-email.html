<div class="access-page">
  <div class="access-glow access-glow--a" aria-hidden="true"></div>
  <div class="access-glow access-glow--b" aria-hidden="true"></div>
  <div class="access-grid" aria-hidden="true"></div>

  <a class="access-home" routerLink="/" aria-label="Ir al inicio">
    <img src="LogoSolvix3.1.png" alt="SOLVIX" class="access-logo">
  </a>

  <div class="access-card fade-up">
    @if (estado === 'cargando') {
      <div class="estado fade-in">
        <div class="spinner" aria-hidden="true"></div>
        <h1>Verificando tu cuenta</h1>
        <p class="mensaje">Estamos comprobando tu enlace de verificación...</p>
      </div>
    } @else if (estado === 'exito') {
      <div class="estado fade-in">
        <div class="icono icono-success" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path fill="currentColor" d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
        </div>
        <h1>Cuenta verificada</h1>
        <p class="mensaje">{{ mensaje }}</p>
        <a routerLink="/login" class="btn-cyber-primary access-submit">Iniciar sesión</a>
      </div>
    } @else {
      <div class="estado fade-in">
        <div class="icono icono-error" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </div>
        <h1>No se pudo verificar</h1>
        <p class="mensaje">{{ mensaje }}</p>

        @if (errorExpirado) {
          <button type="button" class="btn-cyber-primary access-submit" (click)="solicitarNuevoEnlace()">
            Solicitar nuevo enlace
          </button>
        }

        <a routerLink="/login" class="access-back">Volver al inicio de sesión</a>
      </div>
    }
  </div>
</div>
