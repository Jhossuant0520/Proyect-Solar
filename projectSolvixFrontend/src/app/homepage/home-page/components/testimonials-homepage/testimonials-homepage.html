<section class="testimonials">
  <div class="network-bg" aria-hidden="true"></div>
  <svg class="connections" viewBox="0 0 1200 400" aria-hidden="true">
    <path d="M200 200 C 350 50, 550 50, 700 200" />
    <path d="M500 200 C 650 350, 850 350, 1000 200" />
  </svg>

  <h2>Una forma más clara de entender tu energía.</h2>

  <div class="cards">
    @for (item of testimonials; track item.name; let i = $index) {
      <article
        class="card"
        [ngClass]="[item.variant === 'primary' ? 'is-primary' : item.variant === 'neon' ? 'is-neon' : 'is-secondary', item.highlight ? 'highlight' : '']"
        [style.animation-delay]="(i * 0.15) + 's'"
      >
        <span class="quote-mark" aria-hidden="true">”</span>
        <p>{{ item.quote }}</p>
        <div class="card-footer">
          <img [src]="item.photo" [alt]="item.name" />
          <div>
            <h4>{{ item.name }}</h4>
            <span>{{ item.role }}</span>
          </div>
        </div>
      </article>
    }
  </div>
</section>
