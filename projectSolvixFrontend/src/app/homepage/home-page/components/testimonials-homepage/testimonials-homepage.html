<section class="testimonials">
  <div class="testimonials__container">
    <header class="testimonials__header">
      <span class="testimonials__eyebrow">Testimonios Reales</span>
      <h2 class="testimonials__title">
        La experiencia nos respalda, nuestros clientes lo confirman
      </h2>
    </header>

    <div class="testimonials__grid">
      @for (item of testimonials; track item.name; let i = $index) {
        <article class="testimonial-card" [style.--t-stagger]="i">
          <span class="testimonial-card__quote-icon material-symbols-outlined" aria-hidden="true">
            format_quote
          </span>
          <p class="testimonial-card__quote">“{{ item.quote }}”</p>
          <div class="testimonial-card__author">
            <div class="testimonial-card__avatar" aria-hidden="true">{{ item.initials }}</div>
            <div class="testimonial-card__meta">
              <h3 class="testimonial-card__name">{{ item.name }}</h3>
              <p class="testimonial-card__role">{{ item.role }}</p>
            </div>
          </div>
        </article>
      }
    </div>
  </div>
</section>
