<section class="steps-homepage">
  <div class="steps-glow" aria-hidden="true"></div>

  <div class="steps-inner">
    <h2>De tu consumo a tu sistema solar</h2>

    <div class="steps-track">
      <div class="steps-line" aria-hidden="true">
        <span class="steps-line-glow"></span>
      </div>

      @for (step of steps; track step.number) {
        <article class="step-item">
          <div class="step-circle" [class]="'is-' + step.variant">
            <span>{{ step.number }}</span>
          </div>
          <h3>{{ step.title }}</h3>
          <p>{{ step.description }}</p>
        </article>
      }
    </div>
  </div>
</section>
