<section class="stats" #statsSection>
  <div class="stats__container">
    <header class="stats__header">
      <span class="stats__eyebrow">Métricas de Excelencia</span>
      <h2 class="stats__title">Resultados que respaldan nuestro compromiso</h2>
    </header>

    <div class="stats__grid">
      @for (stat of stats; track stat.value; let i = $index) {
        <article class="stats-card" [style.--stats-stagger]="i">
          <div class="stats-card__top">
            <div class="stats-card__icon" aria-hidden="true">
              <span class="material-symbols-outlined">{{ stat.icon }}</span>
            </div>
            <span class="stats-card__indicator" aria-hidden="true"></span>
          </div>
          <p class="stats-card__value">
            <span class="stats-card__number">{{ animatedValues[i] }}</span>
          </p>
          <p class="stats-card__description">{{ stat.description }}</p>
        </article>
      }
    </div>
  </div>
</section>
