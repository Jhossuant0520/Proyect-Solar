<aside class="admin-sidebar" [attr.aria-label]="brandKicker">
  <div class="admin-sidebar__brand">
    <p class="admin-sidebar__name">{{ brandName }}</p>
    <p class="admin-sidebar__kicker">{{ brandKicker }}</p>
  </div>

  <nav class="admin-sidebar__nav" #nav>
    <span
      class="admin-sidebar__indicator"
      [class.is-ready]="indicatorReady"
      [style.transform]="'translateY(' + indicatorY + 'px)'"
      [style.height.px]="indicatorH"
      aria-hidden="true"
    ></span>
    @for (group of groups; track group.label) {
      <div class="admin-sidebar__group">
        <div class="admin-sidebar__group-label">{{ group.label }}</div>
        @for (item of group.items; track item.path) {
          <a
            [routerLink]="item.path"
            routerLinkActive="is-active"
            [routerLinkActiveOptions]="{ exact: item.exact ?? item.path === '/dashboard' }"
            [queryParamsHandling]="preserveQuery ? 'preserve' : ''"
            class="admin-sidebar__link"
          >
            <span class="material-symbols-outlined" aria-hidden="true">{{ item.icon }}</span>
            <span class="admin-sidebar__label">{{ item.label }}</span>
          </a>
        }
      </div>
    }
  </nav>
</aside>
