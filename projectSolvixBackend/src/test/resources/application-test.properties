# Perfil de pruebas: sin MySQL externo (MTP R6)
spring.application.name=projectSolarFishBackend-test

spring.datasource.url=jdbc:h2:mem:solvix_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
solvix.cuenta.fotos-dir=${java.io.tmpdir}/solvix-test-avatares
solvix.productos.imagenes-dir=${java.io.tmpdir}/solvix-test-productos
solvix.servicios.firmas-dir=${java.io.tmpdir}/solvix-test-firmas
solvix.servicios.documentos-dir=${java.io.tmpdir}/solvix-test-documentos
solvix.frontend.base-url=http://localhost:4200
solvix.cors.allowed-origin-patterns=http://localhost:4200
solvix.empresa.nombre=Computer & Electronic Test
solvix.empresa.subtitulo=Servicio técnico especializado
solvix.empresa.correo=test@solvix.local
solvix.empresa.footer-texto=Documento de prueba SOLVIX
solvix.software.desarrollado-por=Jhossuant Cabezas
solvix.software.rol-desarrollador=Full Stack Developer

spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test
spring.mail.password=test
