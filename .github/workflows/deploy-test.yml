name: Deploy Angular TEST

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and Deploy TEST
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./projectSolvixFrontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ./projectSolvixFrontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Angular TEST
        run: npm run build:test

      - name: Verify build
        run: |
          test -f dist/projectSolarFishFrontend/browser/index.html
          echo "Angular TEST build verified"

      - name: Deploy TEST via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./projectSolvixFrontend/dist/projectSolarFishFrontend/browser/
          server-dir: /
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            .well-known/**
            projectSolarFishFrontend/**
